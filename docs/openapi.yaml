components:
  responses:
    BadRequest:
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
              errors:
                type: array
                items:
                  type: object
                  required:
                    - message
                  properties:
                    message:
                      type: string
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    NotFound:
      description: The server cannot find the requested resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
  securitySchemes:
    BearerJwt:
      type: http
      bearerFormat: Json Web Token (JWT)
      scheme: Bearer
      description: "JWT Bearer token authentication. Pass the token as: Authorization:
        Bearer <token>"
tags:
  - name: Auth
    description: Authentication endpoints (signup and signin)
  - name: Users
    description: User management
  - name: Admin
    description: Admin operations
  - name: Languages
    description: Language resources
  - name: Tasks
    description: Task management
  - name: Submissions
    description: Submission handling
